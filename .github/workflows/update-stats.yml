name: Generate GitHub Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Stats
        run: |
          curl -L -o github-stats.svg "https://github-readme-stats.vercel.app/api?username=JidapaChindaprasert"
          curl -L -o top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=JidapaChindaprasert"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "update stats" || true
          git push