name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *" # ให้บอทแอบมาอัปเดตสถิติให้ทุกๆ 12 ชั่วโมง
  workflow_dispatch: # ปุ่มสำหรับให้เรากดรันอัปเดตเองได้

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch GitHub Stats
        run: |
          # โหลดการ์ดสถิติหลัก (ธีมสีพาสเทล)
          curl -o github-stats.svg "https://github-readme-stats.vercel.app/api?username=JidapaChindaprasert&bg_color=FFF0F5&title_color=FF69B4&text_color=FF69B4&icon_color=FF1493&show_icons=true&hide_border=true&border_radius=15"
          
          # โหลดการ์ดภาษา (ธีมสีพาสเทล)
          curl -o top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=JidapaChindaprasert&layout=compact&bg_color=FFF0F5&title_color=FF69B4&text_color=FF69B4&hide_border=true&border_radius=15"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "🎀 Update GitHub Stats SVGs" || echo "No changes to commit"
          git push