name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats Card
        run: |
          curl -L \
          "https://github-readme-stats.vercel.app/api?username=JidapaChindaprasert&show_icons=true&bg_color=FFF0F5&title_color=FF69B4&text_color=FF69B4&icon_color=FF1493&hide_border=true&border_radius=15" \
          -o stats.svg

      - name: Generate Top Languages Card
        run: |
          curl -L \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=JidapaChindaprasert&layout=compact&bg_color=FFF0F5&title_color=FF69B4&text_color=FF69B4&hide_border=true&border_radius=15" \
          -o top-langs.svg

      - name: Commit SVG files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add stats.svg top-langs.svg

          git diff --staged --quiet || git commit -m "Update GitHub Stats"

          git push