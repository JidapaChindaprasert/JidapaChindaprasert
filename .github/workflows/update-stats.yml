name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"  # อัปเดตทุก 12 ชั่วโมง
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        run: |
          curl -g -L -o github-stats.svg \
          "https://github-readme-stats.vercel.app/api?username=JidapaChindaprasert&bg_color=FFF0F5&title_color=FF69B4&text_color=FF69B4&icon_color=FF1493&show_icons=true&hide_border=true&border_radius=15"

          curl -g -L -o top-langs.svg \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=JidapaChindaprasert&layout=compact&bg_color=FFF0F5&title_color=FF69B4&text_color=FF69B4&hide_border=true&border_radius=15"

      - name: Check Files
        run: |
          ls -lah
          file github-stats.svg
          file top-langs.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg top-langs.svg

          git diff --staged --quiet || git commit -m "🎀 Update GitHub Stats SVGs"

          git push